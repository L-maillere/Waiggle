# Les services qui font tourner Ruche sur un serveur, chacun dans son conteneur.
# Lancement : docker compose -f infra/docker-compose.yml up --build
# Les valeurs ${...} viennent du fichier infra/.env (modèle : infra/.env.example).
name: ruche

services:
  # Base de données PostgreSQL, avec l'extension pgvector pour la future recherche sémantique.
  db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ruche}
      POSTGRES_USER: ${POSTGRES_USER:-ruche}
      # « :? » arrête tout avec ce message si le mot de passe n'est pas défini.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Définir POSTGRES_PASSWORD dans infra/.env}
    volumes:
      - db-data:/var/lib/postgresql/data # les données survivent au redémarrage du conteneur
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend

  # L'API, construite à partir du Dockerfile du dépôt.
  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
      APP_VERSION: ${APP_VERSION:-dev}
    depends_on:
      db:
        condition: service_healthy # attend que la base réponde avant de démarrer
    networks:
      - backend
      - web

  # Caddy : la porte d'entrée. Il gère le HTTPS (certificats automatiques) et transmet à l'API.
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      API_DOMAIN: ${API_DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      api:
        condition: service_healthy
    networks:
      - web

networks:
  # Réseau interne : la base n'est joignable que par l'API, jamais depuis Internet.
  backend:
    internal: true
  web:

volumes:
  db-data:
  caddy-data:
  caddy-config:
