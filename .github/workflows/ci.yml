# Intégration continue : GitHub lance ces vérifications à chaque envoi sur main
# et sur chaque pull request. Une pull request n'est fusionnée que si tout est vert.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Droits minimaux : la CI peut lire le code, rien de plus.
permissions:
  contents: read

# Si on pousse deux fois de suite, la vérification précédente est annulée.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Lint, types, tests et construction de l'API et de l'appli web.
  check:
    name: Lint, types, tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4 # version de pnpm lue dans package.json
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile # échoue si pnpm-lock.yaml n'est pas à jour
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  # Photographie l'appli web (catalogue des composants et écrans, sur téléphone et ordinateur, de
  # jour et de nuit) et joint les images à la vérification : page de la vérification, rubrique
  # « Artifacts », fichier « captures ». Pour relire un changement d'interface sans lancer l'appli.
  # Échoue aussi si une page affiche une erreur (par exemple un écart entre le serveur et le navigateur).
  shots:
    name: Screenshots
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @ruche/app exec playwright install --with-deps chromium
      - run: pnpm --filter @ruche/app shots
      - uses: actions/upload-artifact@v4
        if: always() # même en cas d'échec : les images aident à comprendre pourquoi
        with:
          name: captures
          path: apps/app/shots/
          retention-days: 14

  # Cherche des secrets (mots de passe, clés) oubliés dans tout l'historique Git.
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # tout l'historique, pas seulement le dernier commit
      # gitleaks lancé directement dans son conteneur officiel, sur tout l'historique.
      # (L'action GitHub ne savait pas analyser le tout premier commit du dépôt.)
      - run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.24.3 git /repo --redact --verbose

  # Signale les failles connues dans les dépendances (exceptions justifiées dans pnpm-workspace.yaml).
  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          package-manager-cache: false # rien n'est installé ici, donc rien à mettre en cache
      - run: pnpm audit --audit-level high

  # Construit l'image Docker de l'API, puis la démarre comme en production pour un test
  # « de fumée » de bout en bout (voir infra/smoke-test.sh).
  docker:
    name: API image builds and runs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker build -f apps/api/Dockerfile -t ruche-api:ci .
      - run: infra/smoke-test.sh ruche-api:ci
